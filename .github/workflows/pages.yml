name: Verify and publish Virtual Life

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Verify Git LFS objects
        run: git lfs fsck
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - name: Install exact frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify original resource bytes
        run: |
          pnpm verify:dependencies
          pnpm verify:assets
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Cache native and WebAssembly dependencies and tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: virtual-life-rust-v1
          key: ubuntu-24.04-native-wasm32
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify pinned WebAssembly tool version
        run: |
          VERSION=$(node tools/wasm-bindgen-version.mjs)
          if ! command -v wasm-bindgen >/dev/null || [ "$(wasm-bindgen --version)" != "wasm-bindgen $VERSION" ]; then
            cargo install wasm-bindgen-cli --version "$VERSION" --locked --force
          fi
          test "$(wasm-bindgen --version)" = "wasm-bindgen $VERSION"
      - name: Verify original formats and native core
        run: |
          pnpm test:formats
          pnpm test:ci
          python3 tools/test_bitmap_font.py
          python3 tools/export-bitmap-font.py --check
          node tools/export-native-ui.mjs --check
          node tools/export-native-school.mjs --check
          pnpm test:platform
          cargo test --locked --workspace --all-targets
          cargo run --locked --release -p virtual-life-core --example validate_assets -- assets/game/objects
      - name: Build deterministic browser test site
        run: |
          pnpm test:fixtures
          pnpm build:test
      - name: Build production site without test input support
        run: |
          pnpm build
          pnpm verify:dist
      - name: Package shared browser inputs and full test list
        run: |
          mkdir -p .cache/ci
          pnpm exec playwright test --list --forbid-only --fully-parallel --reporter=json > .cache/ci/browser-tests.json
          tar -I 'zstd -T2 -3' -cf .cache/ci/browser-inputs.tar.zst output/test-site output/bevy-scenarios .cache/ci/browser-tests.json
      - name: Share the freshly built browser inputs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-inputs
          path: .cache/ci/browser-inputs.tar.zst
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Preserve the full test list for the deployment gate
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-test-list
          path: .cache/ci/browser-tests.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Package actual static files for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  browser:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - name: Install exact frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Download this run's browser inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-inputs
          path: .cache/ci
      - name: Restore and verify actual resource bytes without another LFS download
        run: |
          tar --zstd -xf .cache/ci/browser-inputs.tar.zst
          cp -R output/test-site/assets/game/. assets/game/
          pnpm verify:assets
          node tools/verify-assets.mjs --root output/test-site --dist
      - name: Install browser and software GPU dependencies
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Test actual WebGPU, game flows, local saves and offline behavior
        env:
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/virtual-life-web-qa
          PLAYWRIGHT_BLOB_OUTPUT_DIR: output/browser-reports/blob
          PLAYWRIGHT_JSON_OUTPUT_FILE: output/browser-reports/shard-${{ matrix.shard }}.json
        run: pnpm exec playwright test --forbid-only --fully-parallel --shard=${{ matrix.shard }}/4 --workers=1 --reporter=list,blob,json
      - name: Preserve shard reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-reports-${{ matrix.shard }}
          path: output/browser-reports
          if-no-files-found: ignore
          retention-days: 1
      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/virtual-life-web-qa
          if-no-files-found: ignore
          retention-days: 7
  # Keep the existing required check name as the all-tests deployment gate.
  build:
    if: always()
    needs: [prepare, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require successful preparation
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
        run: test "$PREPARE_RESULT" = success
      - uses: actions/checkout@v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - name: Install exact report tools
        run: pnpm install --frozen-lockfile
      - name: Download the complete test list
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-test-list
          path: output/browser-test-list
      - name: Download reports from every shard
        id: reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: browser-reports-*
          path: output/browser-reports
          merge-multiple: true
      - name: Merge browser reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: output/browser-reports/merged.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: output/browser-report
          PLAYWRIGHT_HTML_OPEN: never
        run: pnpm exec playwright merge-reports --reporter=json,html output/browser-reports/blob
      - name: Require complete successful browser coverage
        if: always() && steps.reports.outcome == 'success'
        run: node tools/verify-browser-coverage.mjs output/browser-test-list/browser-tests.json output/browser-reports 4
      - name: Require every upstream job to succeed
        if: always()
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$BROWSER_RESULT" = success
      - name: Preserve merged regression report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-report
          path: |
            output/browser-report
            output/browser-reports/merged.json
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Publish verified static artifact
        id: deployment
        uses: actions/deploy-pages@v5.0.1
