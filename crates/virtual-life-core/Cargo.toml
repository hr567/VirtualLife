[package]
name = "virtual-life-core"
version = "0.1.0"
edition = "2024"
description = "Evidence-backed Virtual Life browser runtime and original asset decoders"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[features]
# Offline browser evidence generation only. Never enabled in the production WASM client.
test-support = []

[[example]]
name = "export_web_scenarios"
required-features = ["test-support"]
