[package]
name = "virtual-life-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
test-api = ["virtual-life-app/test-api"]

[dependencies]
virtual-life-app = { path = "../virtual-life-app" }
bevy.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
virtual-life-app = { path = "../virtual-life-app", features = ["web-client"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
serde-wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "HtmlElement", "Event", "console"] }
