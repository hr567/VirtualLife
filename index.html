<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17160f" />
    <meta name="description" content="虚拟人生浏览器移植，游戏数据保存在本机浏览器。" />
    <title>虚拟人生</title>
    <style>
      *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee;font-family:serif}body{display:grid;place-items:center}
      #app{width:min(100vw,calc(100dvh * 4 / 3));height:min(100dvh,calc(100vw * 3 / 4));position:relative}
      #game-canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;outline:none}
      #boot-status{position:absolute;inset:0;display:grid;place-content:center;padding:2rem;white-space:pre-line;background:#000;z-index:2}
      #boot-status[hidden]{display:none}.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" tabindex="0" width="640" height="480" aria-label="虚拟人生，正在载入"></canvas>
      <div id="boot-status" role="status">正在载入游戏引擎…</div>
      <div id="platform-status" class="sr-only" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/web/bootstrap.js"></script>
  </body>
</html>
